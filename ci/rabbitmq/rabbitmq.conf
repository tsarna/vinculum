# RabbitMQ for the integration suite. Mounted at /etc/rabbitmq/rabbitmq.conf;
# the image's own defaults in /etc/rabbitmq/conf.d/ still load alongside it.

# Users, vhost, permissions and exchanges. Imported after the management API
# starts listening and before the AMQP and AMQPS listeners do; the compose
# healthcheck waits for the vhost.
load_definitions = /etc/rabbitmq/definitions.json

listeners.tcp.default = 5672

# The suite declares non-durable, non-exclusive queues — from the tests
# themselves and from VCL `declare { durable = false }`. RabbitMQ 4 refuses
# those by default (channel exception 541, `transient_nonexcl_queues`), and a
# future major removes the option to permit them at all. Permitting it keeps the
# broker running what the tests are written against; changing what they declare
# is a separate decision from providing the broker, and not one to make as a
# side effect of adding CI.
#
# A hedge against someone else's deadline, so it is written down: when RabbitMQ
# removes the feature this line stops working and the whole job goes red at
# once. https://github.com/tsarna/vinculum/issues/250 is what to do first.
deprecated_features.permit.transient_nonexcl_queues = true

# The reconnect tests find the client's connections in the management API's
# connection listing, which comes from the management plugin's metrics
# collection. RabbitMQ has deprecated that and says a future minor version will
# not permit it by default; the image tag follows minor versions. Permitting it
# keeps such an upgrade from emptying the listing, which would fail those tests
# at their first look for a connection to close.
#
# The same kind of hedge as the one above: a major version that removes the
# feature stops this line working. https://github.com/tsarna/vinculum/issues/273
# is the non-deprecated way to do the same, after which this becomes `false`.
deprecated_features.permit.management_metrics_collection = true

# The TLS listener the amqps tests need. Certificates are generated by
# ci/rabbitmq/setup.sh; the CA is private, so those tests supply it as the
# client's `ca_cert` and the system-trust one skips.
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile = /etc/rabbitmq/certs/server.pem
ssl_options.keyfile = /etc/rabbitmq/certs/server-key.pem

# Server-trust only: nothing here tests mTLS, and asking for a client
# certificate would fail every connection that does not offer one.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

management.tcp.port = 15672
