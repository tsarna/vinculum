name: CI

# release/** is here because a patch release is cut from a branch off the
# release tag, not from main — and a branch nothing runs CI on is one the
# release skill's "let CI go green before tagging" step cannot be followed for.
# The tag's own preflight would still catch a bad tree, but only after the tag
# exists, which costs a delete-and-repush instead of a red check.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  # The steps themselves live in checks.yml, so a tag build runs exactly what a
  # pull request runs. Change them there.
  checks:
    uses: ./.github/workflows/checks.yml
