name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Checked rather than applied: a failure here is a one-command fix
      # locally (gofmt -w .), and CI rewriting source is worse than saying so.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd. Run: gofmt -w ." >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The same invariant TestSchemaIsCompleteAndConsistent asserts, checked
      # through the command itself so the CLI's own exit code is covered too.
      - name: Check config-language schema
        run: go run . schema --strict --require-docs -o /dev/null

      # The generated regions of doc/ must match what the schema says. When
      # this fails, the fix is to run the same command with --update.
      - name: Check generated documentation
        run: go run . schema --format markdown --check doc/
