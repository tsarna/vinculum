name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The same invariant TestSchemaIsCompleteAndConsistent asserts, checked
      # through the command itself so the CLI's own exit code is covered too.
      - name: Check config-language schema
        run: go run . schema --strict --require-docs -o /dev/null
