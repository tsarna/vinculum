name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Nothing is published until this passes: the build and test suite the tag
  # was never re-run against, plus the checks that the tree describes *this*
  # release rather than some other one.
  preflight:
    uses: ./.github/workflows/checks.yml
    with:
      release_version: ${{ github.ref_name }}

  release:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Extract the CHANGELOG section for this tag to use as the release body.
      # Written outside the working tree so GoReleaser doesn't see a dirty repo.
      # Fails the release if the section is missing or empty, so a forgotten
      # changelog entry can't ship a blank GitHub Release.
      - name: Extract changelog section
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          version="${GITHUB_REF_NAME#v}"
          core="${version%%-*}"
          extract() {
            awk -v ver="$1" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              flag && /^## / { exit }
              flag { print }
            ' CHANGELOG.md | sed '/./,$!d' > "$notes"
          }
          extract "$core"
          # A prerelease rehearses this pipeline and may be cut before the
          # section is renamed, so fall back to what is still Unreleased.
          # A real release has no such excuse.
          if [ ! -s "$notes" ] && [ "$core" != "$version" ]; then
            extract "Unreleased"
          fi
          if [ ! -s "$notes" ]; then
            echo "::error::No CHANGELOG.md section found for $core" >&2
            exit 1
          fi
          echo "----- release notes -----"
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo token so GoReleaser can push the Homebrew cask to the tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # GoReleaser's --release-notes doesn't populate the body when the
      # changelog is disabled, so set it on the release it just created.
      - name: Set release notes from changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"

  # Chained rather than triggered: the release GoReleaser just created with the
  # default GITHUB_TOKEN cannot start a workflow of its own, so the index has to
  # be asked for here. See the comment at the top of release-index.yml.
  index:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/release-index.yml
