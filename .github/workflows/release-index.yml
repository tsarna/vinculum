name: Build and publish VCL index

# Attaches a pre-built FAISS index to a release as vinculum-index.tar.gz.
#
# vinculum-ai auto-downloads this file from the latest release:
#   https://github.com/tsarna/vinculum/releases/latest/download/vinculum-index.tar.gz
#
# The index is built with fastembed BAAI/bge-small-en-v1.5 (384-dim vectors).
# vinculum-ai users must use the same embedding model when querying — this is
# the default, so no configuration is needed on the user side.
#
# Two triggers, because a release reaches this from two directions:
#
#   workflow_call — Release invokes it after GoReleaser has created the
#     release. This is the path that matters. A release GoReleaser creates
#     with the default GITHUB_TOKEN does *not* raise a `release: published`
#     event that can start a workflow — GitHub suppresses those to prevent
#     recursion — so relying on the trigger below silently stopped attaching
#     the index the moment releases became automated. Found by rehearsing a
#     release with a prerelease tag, which produced every other asset and no
#     index.
#
#   release: published — a release created by hand, from the UI or `gh
#     release create`, which does raise the event. Kept so that path still
#     gets an index.
#
# Both reach the same tag through github.ref_name: a release event runs
# against the release's tag ref, and a called workflow inherits the caller's
# context, which is the tag that triggered Release.

on:
  release:
    types: [published]
  workflow_call:

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to upload release assets

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache fastembed model
        uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-BAAI-bge-small-en-v1.5
          # No restore-keys fallback — the model must exactly match or re-download.

      - name: Install indexing dependencies
        run: |
          pip install --quiet \
            langchain-core \
            langchain-community \
            langchain-text-splitters \
            fastembed \
            faiss-cpu

      - name: Build index
        run: python scripts/build_index.py --docs-dir doc --output vcl-index

      - name: Package index
        run: |
          tar -czf vinculum-index.tar.gz -C vcl-index .
          echo "Archive size: $(du -sh vinculum-index.tar.gz | cut -f1)"

      - name: Upload index to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" vinculum-index.tar.gz
